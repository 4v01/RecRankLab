experiment: slim_v3
output_root: outputs/v3
epochs: 1
continue_failed_trials: true
slim_workers: 2
slim_max_iter: 1000
slim_tol: 0.001
trials:
  - {elastic_alpha: 0.001, l1_ratio: 0.1}
  - {elastic_alpha: 0.001, l1_ratio: 0.5}
  - {elastic_alpha: 0.01, l1_ratio: 0.1}
  - {elastic_alpha: 0.01, l1_ratio: 0.5}
