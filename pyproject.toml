[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recranklab"
version = "0.2.0"
description = "Auditable full-catalog MovieLens recommendation experiments"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "PyYAML>=6,<7", "matplotlib>=3.8,<4", "threadpoolctl>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
"recranklab.models" = ["*.cpp"]
