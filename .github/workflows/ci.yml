name: CPU correctness and MovieLens smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: pip install --no-deps -e .
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q
      - run: python scripts/audit_results.py
      - run: python reports/external_benchmark/verify.py
      - name: Prepare official ML-1M for independent R-squared SST verification
        run: python -m recranklab.data.prepare --dataset ml-1m --config configs/base.yaml
      - run: python scripts/audit_v3.py
      - name: Prepare complete official ML-10M for V4 source-data audit
        run: python -m recranklab.data.prepare --dataset ml-10m --config configs/base.yaml
      - if: hashFiles('reports/v4/experiment_manifest.json') != ''
        name: Audit complete feasible V4 evidence when all expected transfers have arrived
        run: |
          if python -c "import json,sys;sys.exit(0 if json.load(open('reports/v4/completion_status.json')).get('feasible_complete') else 1)"; then
            python scripts/audit_v4.py
          else
            echo "V4 full evidence audit pending unfinished declared work; unit and earlier-generation audits still run."
          fi
  movielens-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: pip install --no-deps -e .
      - run: python -m recranklab.data.prepare --dataset ml-100k --config configs/base.yaml
      - name: All six models on real ML-100K (one epoch; not benchmark scores)
        shell: bash
        run: |
          set -euo pipefail
          for model in popularity biasmf autorec bpr_mf lightgcn ease; do
            config="configs/${model}.yaml"
            if [[ "$model" == popularity ]]; then config=configs/base.yaml; fi
            python -m recranklab.experiments.run --model "$model" --config "$config" --smoke --seeds 17
          done
      - name: V3 rating stopping and new ranking models on ML-100K
        run: python scripts/smoke_v3.py
      - name: V4 original methods and both frozen blend phases on real ML-100K
        run: |
          python scripts/run_v4.py --smoke
          python scripts/hybrid_v4.py --smoke
          python scripts/run_v4.py --smoke --plan configs/v4/anchor_study.yaml
          python scripts/hybrid_v4.py --smoke --plan configs/v4/anchor_study.yaml
          python scripts/smoke_sparse_engine_v4.py
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-metrics-only
          path: |
            outputs/smoke/**/result.json
            outputs/smoke/**/validation.json
            outputs/v3_smoke/**/result.json
            outputs/v3_smoke/**/validation.json
            outputs/v4_smoke/**/result.json
            outputs/v4_smoke/**/validation.json
            outputs/v4_smoke/**/selection.json
            outputs/v4_engine_smoke/**/result.json
            outputs/v4_engine_smoke/**/validation.json
          retention-days: 14
